<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2a1b"/>
      <stop offset="100%" stop-color="#051a10"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#E8C15A"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E7B1A"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE484"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B28C1D"/>
    </linearGradient>
    <linearGradient id="combGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B31E1E"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Golden Hen Artwork -->
  <g filter="url(#goldGlow)" transform="translate(0, 10)">
    <!-- Rooster/Hen Comb (Red/Gold touch) -->
    <path d="M 270 120 C 265 95 245 90 235 105 C 225 85 205 90 195 110 C 185 95 165 100 160 125 C 150 140 160 155 175 160 L 270 150 Z" fill="url(#combGrad)" stroke="#FFE484" stroke-width="3"/>
    
    <!-- Hen Body & Neck -->
    <path d="M 280 155 C 310 180 340 220 340 270 C 340 340 280 400 200 400 C 140 400 100 360 90 320 C 85 295 95 270 115 255 C 130 245 150 250 165 240 C 175 230 170 210 180 190 C 190 170 215 155 240 150 Z" fill="url(#goldGrad)"/>
    
    <!-- Wing Details -->
    <path d="M 230 250 C 270 250 300 280 295 330 C 285 365 250 375 220 375 C 180 375 160 340 170 300 C 180 265 200 250 230 250 Z" fill="#9E7B1A" opacity="0.35"/>
    <path d="M 225 260 C 255 260 280 285 275 325 C 265 350 240 360 215 360 C 185 360 175 335 180 305 C 185 280 200 260 225 260 Z" fill="url(#goldGrad)"/>
    <path d="M 200 280 Q 240 290 260 330" stroke="#FFF2B2" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 190 305 Q 230 315 245 345" stroke="#FFF2B2" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Tail Feathers -->
    <path d="M 100 310 C 70 280 60 230 80 190 C 85 220 105 245 110 265 Z" fill="url(#crestGrad)"/>
    <path d="M 85 280 C 50 250 45 200 65 160 C 70 195 90 225 100 245 Z" fill="url(#goldGrad)"/>
    <path d="M 75 250 C 40 220 40 180 60 140 C 60 175 80 205 90 225 Z" fill="url(#crestGrad)"/>

    <!-- Beak -->
    <polygon points="275,165 315,178 275,188" fill="#FFF2B2" stroke="#9E7B1A" stroke-width="2"/>

    <!-- Wattle -->
    <path d="M 270 190 C 275 210 265 225 255 225 C 248 225 245 215 250 195 Z" fill="url(#combGrad)" stroke="#FFE484" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="245" cy="172" r="7" fill="#051a10"/>
    <circle cx="247" cy="170" r="2.5" fill="#FFFFFF"/>

    <!-- Golden Egg at base -->
    <ellipse cx="330" cy="365" rx="36" ry="48" transform="rotate(15 330 365)" fill="url(#goldGrad)" stroke="#FFF2B2" stroke-width="3"/>
    <ellipse cx="324" cy="350" rx="10" ry="16" transform="rotate(15 324 350)" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Stars & Laurel Border -->
  <g fill="#D4AF37">
    <circle cx="256" cy="465" r="5"/>
    <circle cx="230" cy="462" r="4"/>
    <circle cx="282" cy="462" r="4"/>
    <circle cx="205" cy="454" r="3.5"/>
    <circle cx="307" cy="454" r="3.5"/>
  </g>
</svg>
